<title>Daily Brief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column (~66ch) under a pre-dawn masthead; sticky filter rail; article cards expand in place and end with the rating slip. */
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --ink: #161b2e;
  --ink-2: #4a5068;
  --ink-3: #7a8098;
  --rule: #dfe2ea;
  --accent: #c8611e;          /* dawn amber */
  --accent-ink: #ffffff;
  --accent-soft: #fbeee3;
  --sky: #1d2a4d;             /* masthead night sky */
  --sky-ink: #eef0f7;
  --sky-2: #aab3d1;
  --good: #2f7d4f;
  --star-off: #cfd3de;
  --focus: #3b62d6;
  --chart: #2c4f9e;           /* single data series (validated: band, chroma, contrast) */
  --chart-grid: #e6e8ef;

  --t-industry: #8a5a12;
  --t-china: #b0322a;
  --t-nato: #2c4f9e;
  --t-ukraine: #2a6f86;
  --t-uk_politics: #6b3fa0;
  --t-us_politics: #5e6372;
  --t-ai: #217a5b;
  --t-wildcard: #a63d78;

  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Newsreader", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.4375rem;
  --step-3: 2rem;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --surface: #171b2c; --ink: #e8eaf2; --ink-2: #b4b9cc; --ink-3: #868ca3;
    --rule: #2a3046; --accent: #ec8a45; --accent-ink: #1a1206; --accent-soft: #33241a;
    --sky: #0a0d19; --sky-ink: #eef0f7; --sky-2: #8e98bb; --good: #5cc28a; --star-off: #3a4058; --focus: #8aa6ff;
    --chart: #86a6f0; --chart-grid: #262c40;
    --t-industry: #d9a65a; --t-china: #ef7a70; --t-nato: #86a6f0; --t-ukraine: #6cc2db;
    --t-uk_politics: #b994ea; --t-us_politics: #a9aebd; --t-ai: #62c99f; --t-wildcard: #ea86bf;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --surface: #171b2c; --ink: #e8eaf2; --ink-2: #b4b9cc; --ink-3: #868ca3;
  --rule: #2a3046; --accent: #ec8a45; --accent-ink: #1a1206; --accent-soft: #33241a;
  --sky: #0a0d19; --sky-ink: #eef0f7; --sky-2: #8e98bb; --good: #5cc28a; --star-off: #3a4058; --focus: #8aa6ff;
    --chart: #86a6f0; --chart-grid: #262c40;
  --t-industry: #d9a65a; --t-china: #ef7a70; --t-nato: #86a6f0; --t-ukraine: #6cc2db;
  --t-uk_politics: #b994ea; --t-us_politics: #a9aebd; --t-ai: #62c99f; --t-wildcard: #ea86bf;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--step-0); line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }

.wrap { max-width: 44rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Masthead */
.mast { background: var(--sky); color: var(--sky-ink); position: relative; overflow: hidden; }
.mast::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--accent) 30%, var(--accent) 70%, transparent); opacity: .9; }
.mast .wrap { padding-block: 22px 26px; display: grid; gap: 14px; }
.mast-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.brand { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; font-size: var(--step--1); color: var(--sky-2); }
.brand b { color: var(--accent); font-weight: 800; }
.issue { font-family: var(--f-mono); font-size: var(--step--1); color: var(--sky-2); }
.date { font-family: var(--f-display); font-stretch: 85%; font-weight: 750; font-size: var(--step-3); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.mast-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--f-mono); font-size: var(--step--1); color: var(--sky-2); }
.mast-stats strong { color: var(--sky-ink); font-weight: 500; }
.changes { margin: 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: rgba(255,255,255,.06); border-radius: 0 6px 6px 0; font-size: .95rem; color: var(--sky-ink); }
.changes h2 { margin: 0 0 4px; font-family: var(--f-display); font-size: var(--step--1); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
.changes ul { margin: 0; padding-left: 18px; }
.mast-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; border-radius: 999px; padding: 8px 16px; font-family: var(--f-display); font-weight: 650; font-size: .875rem; cursor: pointer; letter-spacing: .01em; }
.btn-accent { background: var(--accent); color: var(--accent-ink); }
.btn-accent:hover { filter: brightness(1.07); }
.btn-ghost { background: transparent; color: var(--sky-ink); border-color: rgba(255,255,255,.25); }
.btn-ghost:hover { border-color: var(--sky-2); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.status-line { font-family: var(--f-mono); font-size: var(--step--1); color: var(--sky-2); }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Rail */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--rule); }
.rail .wrap { padding-block: 10px; display: grid; gap: 8px; }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: none; padding: 6px 10px; border-radius: 6px; font-family: var(--f-display); font-weight: 650; font-size: .875rem; color: var(--ink-3); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); background: var(--bg); }
.tab .n { font-family: var(--f-mono); font-weight: 400; opacity: .7; margin-left: 5px; }
.tabs { overflow-x: auto; scrollbar-width: none; }
.tab { white-space: nowrap; }
.brief { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; }
.brief h3 { margin: 0; font-family: var(--f-display); font-stretch: 88%; font-weight: 700; font-size: 1.12rem; line-height: 1.22; text-wrap: balance; }
.brief p { margin: 0; color: var(--ink-2); font-size: 1rem; line-height: 1.5; }
.brief .src { font-family: var(--f-display); font-size: .78rem; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.brief .src a { color: var(--ink-3); }
.brief .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 4px; }
.req { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px; padding: 6px 14px; font-family: var(--f-display); font-weight: 650; font-size: .82rem; cursor: pointer; }
.req[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.req.done { border-color: var(--good); color: var(--good); background: transparent; }
.req:disabled { opacity: .6; cursor: default; }
.asked { color: var(--accent); }
.focus-box { display: grid; gap: 4px; }
.focus-box label { font-family: var(--f-display); font-weight: 650; font-size: .82rem; color: var(--ink-2); }
.focus-box textarea { width: 100%; min-height: 56px; resize: vertical; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; background: var(--surface); font-family: var(--f-body); font-size: 1rem; line-height: 1.4; }
.req-bar { position: sticky; bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 4; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 12px 10px 16px; font-family: var(--f-display); font-size: .9rem; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.req-bar .btn-accent { padding: 7px 14px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-family: var(--f-display); font-size: .8125rem; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .n { font-family: var(--f-mono); font-weight: 400; opacity: .7; margin-left: 4px; }
.progress { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: var(--step--1); color: var(--ink-3); }
.bar { flex: 1; height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }

/* Feed */
main .wrap { padding-block: 18px 60px; display: grid; gap: 14px; }
.banner { padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); font-size: .95rem; }
.round-head { font-family: var(--f-display); font-stretch: 85%; text-transform: uppercase; letter-spacing: .12em; font-size: var(--step--1); color: var(--ink-3); font-weight: 700; display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.round-head::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.card-head { display: grid; gap: 8px; padding: 16px 18px 14px; cursor: pointer; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-family: var(--f-display); font-size: .78rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
.topic { color: var(--tc, var(--ink-2)); display: inline-flex; align-items: center; gap: 6px; }
.topic::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--tc, var(--ink-3)); }
.kind { border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; font-size: .7rem; }
.kind.opinion { color: var(--accent); }
.mins { font-family: var(--f-mono); text-transform: none; letter-spacing: 0; font-weight: 400; }
.rated { margin-left: auto; font-family: var(--f-mono); text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--good); }
.card h3 { margin: 0; font-family: var(--f-display); font-stretch: 88%; font-weight: 720; font-size: var(--step-2); line-height: 1.18; text-wrap: balance; letter-spacing: -.005em; }
.update-of { font-size: .875rem; color: var(--ink-3); font-style: italic; }
.tldr { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: .98rem; display: grid; gap: 3px; }
.head-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.thumbs { display: inline-flex; gap: 6px; margin-left: auto; }
.thumb { width: 40px; height: 36px; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 7px; cursor: pointer; color: var(--ink-3); }
.thumb svg { width: 100%; height: 100%; display: block; fill: currentColor; }
.thumb.down svg { transform: scaleY(-1); }
.thumb.mid svg { transform: rotate(-90deg); }
.thumb:hover { border-color: var(--ink-3); }
.thumb[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.toggle { justify-self: start; background: none; border: 0; padding: 2px 0; font-family: var(--f-display); font-weight: 650; font-size: .85rem; color: var(--accent); cursor: pointer; }

.card-body { border-top: 1px solid var(--rule); padding: 18px; display: grid; gap: 16px; }
.prose { font-size: var(--step-1); line-height: 1.62; max-width: 66ch; }
.prose p { margin: 0 0 .85em; }
.prose p:last-child { margin-bottom: 0; }
.fig { margin: 0; display: grid; gap: 8px; padding: 14px 0 6px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.fig figcaption { display: grid; gap: 2px; }
.fig .fig-title { font-family: var(--f-display); font-weight: 700; font-size: .95rem; }
.fig .fig-note { font-size: .9rem; color: var(--ink-2); }
.fig .fig-src { font-family: var(--f-display); font-size: .75rem; color: var(--ink-3); }
.fig svg { width: 100%; height: auto; display: block; overflow: visible; }
.fig svg text { font-family: var(--f-display); fill: var(--ink-2); }
.fig svg .val { fill: var(--ink); font-weight: 650; }
.fig svg .lbl { fill: var(--ink-2); }
.fig svg .tick { fill: var(--ink-3); font-family: var(--f-mono); }
.fig svg .grid { stroke: var(--chart-grid); stroke-width: 1; }
.fig svg .bar { fill: var(--chart); }
.fig svg .bar.hl { fill: var(--accent); }
.fig svg .line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.fig svg .area { fill: var(--chart); opacity: .1; }
.fig svg .dot { fill: var(--chart); stroke: var(--surface); stroke-width: 2; }
.fig svg .hit { fill: transparent; }
.fig svg .hit:hover + .dot, .fig svg g.pt:hover .dot { r: 6; }
.fig svg g.row:hover .bar { opacity: .85; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 10px; }
.stat { background: var(--bg); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.stat .v { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; color: var(--ink); }
.stat .l { font-family: var(--f-display); font-size: .82rem; color: var(--ink-2); }
.fig details summary { font-family: var(--f-display); font-size: .78rem; color: var(--ink-3); cursor: pointer; }
.fig details table { margin-top: 6px; }
.why { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; font-size: 1.02rem; }
.why strong { font-family: var(--f-display); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 2px; color: var(--accent); }
.sources h4, .slip h4 { margin: 0 0 6px; font-family: var(--f-display); font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 700; }
.sources ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .95rem; }
.sources li { min-width: 0; overflow-wrap: anywhere; }
.sources .outlet { font-family: var(--f-display); font-weight: 650; font-size: .85rem; margin-right: 6px; }
.share { display: grid; gap: 8px; }
.share-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.share-btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-family: var(--f-display); font-size: .8rem; font-weight: 650; color: var(--ink); cursor: pointer; text-decoration: none; }
.share-btn:hover { border-color: var(--ink-3); }
.share-out { width: 100%; min-height: 120px; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; background: var(--bg); font-family: var(--f-mono); font-size: .78rem; line-height: 1.45; }
.share-msg { font-family: var(--f-mono); font-size: .75rem; color: var(--good); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; font-family: var(--f-mono); font-size: .75rem; color: var(--ink-3); }

/* Rating slip */
.slip { border-top: 1px dashed var(--rule); padding: 16px 18px 18px; display: grid; gap: 14px; background: color-mix(in srgb, var(--bg) 55%, var(--surface)); }
.scales { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 12px 24px; }
.scale { display: grid; gap: 2px; }
.scale label { font-family: var(--f-display); font-weight: 650; font-size: .875rem; }
.scale .hint { font-size: .8rem; color: var(--ink-3); font-family: var(--f-display); }
.stars { display: flex; gap: 2px; }
.star { width: 40px; height: 40px; border: 0; background: none; padding: 4px; cursor: pointer; color: var(--star-off); border-radius: 6px; }
.star svg { width: 100%; height: 100%; display: block; fill: currentColor; }
.star.on { color: var(--accent); }
.qtags { display: flex; flex-wrap: wrap; gap: 6px; }
.qtag { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-family: var(--f-display); font-size: .8rem; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.qtag[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.note label { display: block; font-family: var(--f-display); font-weight: 650; font-size: .875rem; margin-bottom: 4px; }
.note textarea { width: 100%; min-height: 74px; resize: vertical; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; background: var(--surface); font-family: var(--f-body); font-size: 1rem; line-height: 1.45; }
.saved { font-family: var(--f-mono); font-size: .75rem; color: var(--ink-3); min-height: 1em; }
.saved.ok { color: var(--good); }
.saved.err { color: var(--t-china); }

/* Archive + About */
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-stretch: 88%; font-size: var(--step-2); font-weight: 720; }
.arch-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.arch-list button { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 12px; border: 0; background: none; padding: 10px 8px; border-radius: 6px; cursor: pointer; font-family: var(--f-display); font-weight: 600; }
.arch-list button:hover { background: var(--bg); }
.arch-list .m { font-family: var(--f-mono); font-weight: 400; color: var(--ink-3); font-size: .8rem; }
.md h3 { font-family: var(--f-display); font-size: 1rem; margin: 14px 0 4px; }
.md ul { margin: 0; padding-left: 18px; }
.md p { margin: 0 0 6px; color: var(--ink-2); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-family: var(--f-display); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
td.num { font-family: var(--f-mono); text-align: right; }
.empty { color: var(--ink-3); font-style: italic; }
footer { text-align: center; color: var(--ink-3); font-family: var(--f-mono); font-size: .75rem; padding-bottom: 30px; }

@media (max-width: 480px) {
  .date { font-size: 1.65rem; }
  .card h3 { font-size: 1.25rem; }
  .card-head, .card-body, .slip { padding-left: 14px; padding-right: 14px; }
  .star { width: 44px; height: 44px; }
}
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .bar i { transition: none; } }
</style>

<header class="mast">
  <div class="wrap">
    <div class="mast-top">
      <span class="brand">Daily <b>Brief</b></span>
      <span class="issue" id="issue"></span>
    </div>
    <h1 class="date" id="date">Today's brief</h1>
    <div class="mast-stats" id="stats"></div>
    <aside class="changes" id="changes" hidden>
      <h2>Changed because of your feedback</h2>
      <ul id="changes-list"></ul>
    </aside>
    <div class="mast-actions">
      <button class="btn btn-accent" id="refresh" type="button">Refresh: add more articles</button>
      <button class="btn btn-ghost" id="edition-pdf" type="button">Save edition as PDF</button>
      <span class="status-line" id="refresh-status" role="status"></span>
    </div>
  </div>
</header>

<nav class="rail" aria-label="Sections">
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-today" aria-selected="true" data-view="today">Today</button>
      <button class="tab" role="tab" id="tab-more" aria-selected="false" data-view="more">More stories<span class="n" id="more-count"></span></button>
      <button class="tab" role="tab" id="tab-archive" aria-selected="false" data-view="archive">Archive</button>
      <button class="tab" role="tab" id="tab-about" aria-selected="false" data-view="about">What I've learned</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
    <div class="progress" id="progress-row"><span id="progress-text">0 / 0 rated</span><span class="bar"><i id="progress-bar"></i></span></div>
  </div>
</nav>

<main>
  <div class="wrap" id="view"></div>
</main>
<footer id="foot"></footer>

<script id="brief-data" type="application/json">__BRIEF_DATA__</script>
<script>
(function () {
  "use strict";
  var DATA;
  try { DATA = JSON.parse(document.getElementById("brief-data").textContent); }
  catch (e) { DATA = null; }
  if (!DATA || !DATA.edition) {
    document.getElementById("view").innerHTML = '<p class="empty">No edition data in this page.</p>';
    return;
  }

  var OFFLINE = DATA.mode === "offline";
  var TOPICS = {
    industry: "Industry", uk_politics: "UK Politics", ukraine: "Ukraine War", nato: "NATO & Defence",
    china: "China", ai: "AI in Practice", us_politics: "US Politics", wildcard: "Wildcard"
  };
  var TOPIC_ORDER = ["industry", "uk_politics", "ukraine", "nato", "china", "ai", "us_politics", "wildcard"];
  var QUICK = [
    ["more", "More like this"], ["less", "Less like this"], ["too_long", "Too long"],
    ["too_shallow", "Too shallow"], ["already_knew", "Already knew"], ["biased", "Biased"], ["great_source", "Great source"]
  ];
  var THUMB = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v11H3V10h4zm2 11h8.3a2 2 0 0 0 2-1.6l1.4-7A2 2 0 0 0 18.7 10H14l.8-4.2a1.6 1.6 0 0 0-2.9-1.2L9 10v11z"/></svg>';
  var VOTE_LABEL = { up: "Want more", mid: "It's OK", down: "Not for me" };
  // Older ratings stored the vote as 1 / -1.
  function voteOf(r) { var v = r && r.summary_vote; return v === 1 ? "up" : v === -1 ? "down" : (VOTE_LABEL[v] ? v : ""); }
  var STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.3l-5.8 3.1 1.2-6.5L2.6 9.4l6.5-.8z"/></svg>';

  var editions = [DATA.edition].concat(DATA.archive || []);
  var byDate = {};
  editions.forEach(function (e) { byDate[e.date] = e; });
  var state = {
    view: "today",
    date: DATA.edition.date,
    filter: "all",
    open: {},
    ratings: {},      // key `${date}_${id}` -> rating object
    requests: {},     // key `${date}_${briefId}` -> request doc ("Write this up")
    db: null
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function key(date, id) { return date + "_" + id; }
  function fmtDate(iso, opts) {
    var d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("en-GB", opts || { weekday: "long", day: "numeric", month: "long" });
  }
  function words(a) { return a.body.join(" ").split(/\s+/).filter(Boolean).length; }

  // ---------- local storage (per-device cache; the only store offline) ----------
  var LS_KEY = "daily-brief-ratings-v1";
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { return {}; } }
  function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(state.ratings)); } catch (e) {} }
  state.ratings = lsLoad();

  // ---------- db (live viewer) ----------
  var pending = {}, writing = {}, timers = {};
  function connectDb() {
    if (OFFLINE || !window.claude || !window.claude.use) return;
    window.claude.use("db").then(function (db) {
      if (!db) return;
      state.db = db;
      var dates = editions.map(function (e) { return e.date; }).slice(0, 30);
      db.collection("ratings").where("date", "in", dates).onSnapshot(function (snap) {
        var changed = [];
        snap.docs.forEach(function (d) {
          var v = d.data();
          if (!v) return;
          var k = d.id, local = state.ratings[k];
          // Keep the local copy while this page has an unsaved edit for it,
          // and ignore echoes of our own writes (same or older timestamp).
          if (pending[k] || writing[k]) return;
          if (local && local.updated_at && v.updated_at && local.updated_at >= v.updated_at) return;
          // Snapshot data is frozen (arrays included), so keep a deep, editable copy.
          state.ratings[k] = JSON.parse(JSON.stringify(v));
          changed.push(k);
        });
        if (!changed.length) return;
        lsSave();
        // Patch only the cards that changed, and never the one you are typing in.
        var active = document.activeElement;
        changed.forEach(function (k) {
          var card = $("card-" + k), p = splitKey(k), a = findArt(p);
          if (card && a && !(active && card.contains(active))) rerenderCard(p.date, a);
        });
        renderRail();
        if (state.view === "archive") renderArchive();
        if (state.view === "more") renderMore();
      }, function () { setDbStatus("Ratings sync stopped. Reload the page to reconnect."); });
      db.collection("requests").where("date", "in", dates).onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { var v = d.data(); if (v) next[d.id] = JSON.parse(JSON.stringify(v)); });
        Object.keys(reqPending).forEach(function (k) { if (reqPending[k] === "add") next[k] = state.requests[k] || next[k]; else delete next[k]; });
        state.requests = next;
        renderTabsCount();
        if (state.view === "more" && !(document.activeElement && document.activeElement.tagName === "TEXTAREA")) renderMore(true);
      }, function () {});
    }).catch(function () {});
  }
  function setDbStatus(msg) {
    var b = $("db-banner");
    if (b) { b.textContent = msg; b.hidden = !msg; }
  }

  function queueSave(date, art, delay) {
    var k = key(date, art.id);
    var r = state.ratings[k];
    r.updated_at = new Date().toISOString();
    lsSave();
    showSaved(k, "Saving…", "");
    if (!state.db) { showSaved(k, OFFLINE ? "Saved on this device" : "Saved on this device (not synced)", "ok"); return; }
    pending[k] = true;
    clearTimeout(timers[k]);
    timers[k] = setTimeout(function () { flush(k); }, delay || 700);
  }
  function flush(k) {
    if (writing[k]) { timers[k] = setTimeout(function () { flush(k); }, 400); return; }
    delete pending[k];
    writing[k] = true;
    var body = JSON.parse(JSON.stringify(state.ratings[k]));
    state.db.doc("ratings/" + k).set(body).then(function () {
      writing[k] = false;
      showSaved(k, "Saved ✓", "ok");
    }, function (e) {
      writing[k] = false;
      var code = e && e.code;
      showSaved(k, code === "quota_exceeded" ? "Storage is full. Tell Claude to prune old ratings." :
        code === "invalid_argument" ? "This view can't save ratings." : "Not saved. Check your connection and change a rating to retry.", "err");
    });
  }
  function showSaved(k, msg, cls) {
    var el = document.querySelector('[data-saved="' + k + '"]');
    if (el) { el.textContent = msg; el.className = "saved " + (cls || ""); }
  }

  function ratingFor(date, art) {
    var k = key(date, art.id);
    if (!state.ratings[k]) {
      state.ratings[k] = {
        date: date, article_id: art.id, round: art.round || 1, topic: art.topic, title: art.title, kind: art.kind,
        read_minutes: art.read_minutes, tags: art.tags || [],
        outlets: (art.sources || []).map(function (s) { return s.outlet; }),
        relevance: 0, quality: 0, summary_vote: "", quick_tags: [], feedback: "", updated_at: null
      };
    }
    return state.ratings[k];
  }
  function isRated(date, art) {
    var r = state.ratings[key(date, art.id)];
    return !!(r && (r.relevance || r.quality || r.summary_vote));
  }

  // ---------- refresh ----------
  var REFRESH_LS = "daily-brief-refresh";
  function refreshSetup() {
    var btn = $("refresh"), st = $("refresh-status");
    if (OFFLINE) {
      btn.hidden = true;
      $("edition-pdf").hidden = true;
      st.innerHTML = 'Offline copy. Ratings here stay on this device.' + (DATA.viewer_url ? ' <a href="' + esc(DATA.viewer_url) + '" style="color:var(--sky-ink)">Open the live brief</a> to teach the agent.' : '');
      return;
    }
    if (!DATA.trigger_id) {
      btn.disabled = true;
      st.textContent = "Refresh switches on once the morning routine is set up.";
      return;
    }
    var last = null;
    try { last = JSON.parse(localStorage.getItem(REFRESH_LS) || "null"); } catch (e) {}
    var latestRound = Math.max.apply(null, DATA.edition.articles.map(function (a) { return a.round || 1; }));
    if (last && last.date === DATA.edition.date && last.round >= latestRound && Date.now() - last.at < 45 * 60000) {
      st.textContent = "Refresh requested at " + new Date(last.at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) + ". New articles usually arrive within 20 minutes; this page updates by itself.";
    }
    btn.addEventListener("click", function () { startRefresh(st); });
    function startRefresh(st) {
      if (!window.claude || !window.claude.use) { st.textContent = "Refresh only works inside claude.ai."; return; }
      btn.disabled = true;
      st.innerHTML = '<span class="spin" aria-hidden="true"></span> Asking the agent…';
      window.claude.use("mcp").then(function (mcp) {
        if (!mcp) throw { code: "not_granted" };
        return mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: DATA.trigger_id, text: "mode=refresh date=" + DATA.edition.date });
      }).then(function () {
        try { localStorage.setItem(REFRESH_LS, JSON.stringify({ date: DATA.edition.date, round: latestRound, at: Date.now() })); } catch (e) {}
        st.textContent = "Agent started. It writes up your requested stories first, then adds more. New articles usually arrive within 20 minutes; this page updates by itself.";
        setTimeout(function () { btn.disabled = false; }, 60000);
      }).catch(function (e) {
        btn.disabled = false;
        var c = e && e.code;
        st.textContent =
          c === "server_not_connected" ? "Add the Claude Code Remote connector in claude.ai Settings → Connectors, then try again." :
          c === "needs_reauth" ? "Reconnect Claude Code Remote in claude.ai Settings → Connectors." :
          c === "approval_required" || c === "not_in_manifest" ? "Refresh needs your permission. Press it again and choose Allow." :
          c === "not_granted" ? "This view can't start the agent. Open the brief on claude.ai." :
          "Couldn't start the agent (" + (c || "error") + "). Try again in a minute.";
      });
    }
    window.__startRefresh = startRefresh;
  }

  // ---------- rendering ----------
  function renderMast() {
    var ed = byDate[state.date];
    $("date").textContent = fmtDate(ed.date);
    var n = editions.length;
    $("issue").textContent = (DATA.issue_number ? "No. " + DATA.issue_number + " · " : "") + ed.date;
    var mins = ed.articles.reduce(function (s, a) { return s + (a.read_minutes || 2); }, 0);
    var topics = {};
    ed.articles.forEach(function (a) { topics[a.topic] = 1; });
    $("stats").innerHTML = "<span><strong>" + ed.articles.length + "</strong> articles</span><span><strong>" + mins + "</strong> min reading</span><span><strong>" + Object.keys(topics).length + "</strong> topics</span>";
    var ch = ed.changes || [];
    $("changes").hidden = !ch.length;
    $("changes-list").innerHTML = ch.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("");
  }

  function renderRail() {
    var ed = byDate[state.date];
    var counts = {}, items = state.view === "more" ? (ed.briefs || []) : ed.articles;
    items.forEach(function (a) { counts[a.topic] = (counts[a.topic] || 0) + 1; });
    var chips = ['<button class="chip" data-filter="all" aria-pressed="' + (state.filter === "all") + '">All<span class="n">' + items.length + "</span></button>"];
    if (state.view === "today") chips.push('<button class="chip" data-filter="unrated" aria-pressed="' + (state.filter === "unrated") + '">Unrated</button>');
    TOPIC_ORDER.forEach(function (t) {
      if (!counts[t]) return;
      chips.push('<button class="chip" data-filter="' + t + '" aria-pressed="' + (state.filter === t) + '">' + TOPICS[t] + '<span class="n">' + counts[t] + "</span></button>");
    });
    $("chips").innerHTML = chips.join("");
    $("chips").hidden = state.view !== "today" && state.view !== "more";
    renderTabsCount();
    $("progress-row").hidden = state.view !== "today";
    var rated = ed.articles.filter(function (a) { return isRated(ed.date, a); }).length;
    $("progress-text").textContent = rated + " / " + ed.articles.length + " rated";
    $("progress-bar").style.width = (ed.articles.length ? rated / ed.articles.length * 100 : 0) + "%";
    document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.view === state.view)); });
  }

  function renderTabsCount() {
    var ed = byDate[state.date], n = (ed.briefs || []).length;
    $("more-count").textContent = n ? String(n) : "";
    $("tab-more").hidden = !n && !(DATA.edition.briefs || []).length;
  }
  function openRequests() {
    return Object.keys(state.requests).filter(function (k) { return state.requests[k].status === "pending"; });
  }

  // ---------- More stories (briefs) ----------
  var reqPending = {};
  function briefHtml(date, b) {
    var k = key(date, b.id), r = state.ratings[k], vote = voteOf(r), req = state.requests[k];
    var h = '<article class="brief" id="card-' + k + '" style="--tc: var(--t-' + esc(b.topic) + ')">';
    h += '<div class="meta"><span class="topic">' + esc(TOPICS[b.topic] || b.topic) + "</span>";
    if (vote) h += '<span class="rated">' + VOTE_LABEL[vote] + "</span>";
    h += "</div><h3>" + esc(b.title) + "</h3><p>" + esc(b.summary) + "</p>";
    h += '<div class="src">' + (b.sources || []).map(function (s) {
      return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.outlet) + "</a>";
    }).join("") + "</div>";
    h += '<div class="acts">';
    if (!OFFLINE) {
      var done = findWrittenUp(k);
      if (done) h += '<button type="button" class="req done" data-goto="' + done + '">Written up: read it</button>';
      else if (req && req.status === "failed") h += '<button type="button" class="req" disabled>Couldn\'t be written up</button>';
      else h += '<button type="button" class="req" data-req="' + k + '" aria-pressed="' + !!req + '">' + (req ? "Requested ✓" : "Write this up") + "</button>";
    }
    h += '<span class="thumbs" role="group" aria-label="Quick rating">' + ["up", "mid", "down"].map(function (v) {
      return '<button type="button" class="thumb ' + v + '" data-vote="' + v + '" data-k="' + k + '" aria-pressed="' + (vote === v) + '" aria-label="' + VOTE_LABEL[v] + '" title="' + VOTE_LABEL[v] + '">' + THUMB + "</button>";
    }).join("") + "</span></div>";
    if (!OFFLINE && req && req.status === "pending") {
      h += '<div class="focus-box"><label for="focus-' + k + '">Anything to focus on? (optional)</label>' +
        '<textarea id="focus-' + k + '" data-focus="' + k + '" placeholder="e.g. What it means for UK bakeries. Who supplies their equipment?">' + esc(req.focus || "") + "</textarea>" +
        '<span class="saved" data-saved="req-' + k + '"></span></div>';
    }
    return h + "</article>";
  }
  // The article key (date_aXX) written from a brief, if any edition has one.
  function findWrittenUp(bk) {
    for (var i = 0; i < editions.length; i++) {
      var hit = editions[i].articles.filter(function (a) { return a.from_brief === bk; })[0];
      if (hit) return key(editions[i].date, hit.id);
    }
    var rq = state.requests[bk];
    return rq && rq.status === "done" && rq.article_date && byDate[rq.article_date] ? key(rq.article_date, rq.article_id) : "";
  }
  function renderMore(keepScroll) {
    var ed = byDate[state.date], y = window.scrollY;
    var list = (ed.briefs || []).filter(function (b) { return state.filter === "all" || b.topic === state.filter; });
    var h = '<div class="banner">Short summaries of more stories. Press <b>Write this up</b> on any you want in full: the next refresh writes them first. Thumbs teach the agent too.</div>';
    list.forEach(function (b) { h += briefHtml(ed.date, b); });
    if (!list.length) h += '<p class="empty">No summaries in this section.</p>';
    var n = openRequests().length;
    if (n && !OFFLINE) h += '<div class="req-bar" role="status"><span>' + n + " requested · they'll be written in the next refresh</span>" +
      (DATA.trigger_id && state.date === DATA.edition.date ? '<button type="button" class="btn btn-accent" id="req-refresh">Write them now</button>' : "") + "</div>";
    $("view").innerHTML = h;
    if (keepScroll) window.scrollTo(0, y);
  }
  function toggleRequest(k) {
    var p = splitKey(k), b = findArt(p);
    if (!b) return;
    var r = ratingFor(p.date, b), has = !!state.requests[k];
    if (has && state.requests[k].status !== "pending") return;
    if (has) {
      delete state.requests[k]; r.requested = false;
      if (r.auto_vote) { r.summary_vote = ""; r.auto_vote = false; }
    } else {
      state.requests[k] = { date: p.date, brief_id: b.id, topic: b.topic, title: b.title, summary: b.summary,
        sources: b.sources || [], tags: b.tags || [], requested_at: new Date().toISOString(), status: "pending" };
      r.requested = true;
      if (!r.summary_vote) { r.summary_vote = "up"; r.auto_vote = true; }
    }
    queueSave(p.date, b);
    renderMore(true);
    if (!has) { var fb = $("focus-" + k); if (fb) fb.focus({ preventScroll: true }); }
    if (!state.db) return;
    reqPending[k] = has ? "remove" : "add";
    var ref = state.db.doc("requests/" + k);
    (has ? ref.delete() : ref.set(state.requests[k])).then(function () { delete reqPending[k]; }, function () {
      delete reqPending[k];
      if (has) state.requests[k] = { status: "pending" }; else delete state.requests[k];
      renderMore(true);
    });
  }

  // Plain text for sharing. The viewer link is private, so shared text carries the
  // article itself plus the original sources rather than a link to this page.
  function shareText(a, mode) {
    var lines = [a.title, ""];
    if (mode === "full") lines = lines.concat(a.body.join("\n\n").split("\n"), [""]);
    else lines = lines.concat(a.tldr.map(function (t) { return "• " + t; }), [""]);
    if (a.why_it_matters && a.topic !== "industry") lines.push("Why it matters: " + a.why_it_matters, "");
    lines.push("Sources:");
    (a.sources || []).forEach(function (s) { lines.push("- " + s.outlet + ": " + s.url); });
    return lines.join("\n");
  }
  function doShare(btn) {
    var p = splitKey(btn.dataset.k), a = findArt(p);
    if (!a) return;
    var msg = document.querySelector('[data-share-msg="' + btn.dataset.k + '"]');
    var mode = btn.dataset.share;
    var text = shareText(a, mode === "full" ? "full" : "summary");
    if (mode === "native") {
      navigator.share({ title: a.title, text: text }).catch(function () {});
      return;
    }
    function fallback() {
      var box = btn.closest(".share");
      var ta = box.querySelector(".share-out");
      if (!ta) { ta = document.createElement("textarea"); ta.className = "share-out"; ta.readOnly = true; ta.setAttribute("aria-label", "Text to share"); box.appendChild(ta); }
      ta.value = text; ta.focus(); ta.select();
      if (msg) msg.textContent = "Selected below. Copy it and paste into a message.";
    }
    try {
      navigator.clipboard.writeText(text).then(function () {
        if (msg) msg.textContent = "Copied. Paste it into WhatsApp, email or Teams.";
      }, fallback);
    } catch (e) { fallback(); }
  }

  // PDFs are built by scripts/make_pdf.py and published next to the page as pdf/<date>/<file>.pdf.
  function savePdf(path, filename, msgEl) {
    function say(t) { if (msgEl) msgEl.textContent = t; }
    if (!window.claude || !window.claude.use) { say("Saving PDFs only works inside claude.ai."); return; }
    say("Preparing PDF…");
    var blobP = fetch(path).then(function (r) { if (!r.ok) throw { code: "missing" }; return r.arrayBuffer(); });
    Promise.all([window.claude.use("downloads"), blobP]).then(function (res) {
      if (!res[0]) throw { code: "unavailable" };
      return res[0].save({ filename: filename, data: res[1] });
    }).then(function () {
      say("Saved. Share it from your Downloads or Files app.");
    }).catch(function (e) {
      var c = e && e.code;
      say(c === "declined" ? "Not saved." :
        c === "missing" ? "No PDF for this edition yet. It is made with each morning's brief." :
        c === "rate_limited" ? "A save is already open. Finish that one first." :
        c === "unavailable" || c === "not_granted" ? "This view can't save files. Open the brief on claude.ai." :
        "Couldn't save the PDF (" + (c || "error") + ").");
    });
  }

  // ---------- article figures (inline SVG, single series, theme tokens) ----------
  function fmtNum(v, vis) {
    var a = Math.abs(v), d = vis.decimals != null ? vis.decimals : (a !== 0 && a < 10 && v % 1 ? 1 : 0);
    var str = a.toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
    return (v < 0 ? "−" : "") + (vis.prefix || "") + str + (vis.unit || "");
  }
  function niceTicks(lo, hi, n) {
    var span = hi - lo || Math.abs(hi) || 1, step = Math.pow(10, Math.floor(Math.log10(span / n))), err = span / n / step;
    step *= err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
    var out = [];
    for (var t = Math.floor(lo / step) * step; t <= hi + step * 1e-9; t += step) out.push(+t.toFixed(10));
    if (out[out.length - 1] < hi) out.push(out[out.length - 1] + step);
    return out;
  }
  // Draw at the real column width so 14px text stays 14px on phones.
  function figW() { var v = $("view"); return Math.max(300, Math.min(640, (v ? v.clientWidth : 640) - 40)); }
  function barSvg(vis) {
    var W = figW(), rowH = 46, top = 4, d = vis.data;
    var minV = Math.min(0, Math.min.apply(null, d.map(function (x) { return x.value; })));
    var maxV = Math.max(0, Math.max.apply(null, d.map(function (x) { return x.value; })));
    // Leave room for value labels at both ends: right of positive bars, left of negative ones.
    var padL = minV < 0 ? 62 : 0, plotW = W - padL - (maxV > 0 ? 70 : 8), x0 = padL + (minV < 0 ? plotW * (-minV / (maxV - minV)) : 0);
    var sc = plotW / ((maxV - minV) || 1);
    var H = top + d.length * rowH;
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(vis.title) + '">';
    out += '<line class="grid" x1="' + x0 + '" x2="' + x0 + '" y1="' + top + '" y2="' + H + '"/>';
    d.forEach(function (row, i) {
      var y = top + i * rowH, bw = Math.max(Math.abs(row.value) * sc, 2), bx = row.value < 0 ? x0 - bw : x0, by = y + 20, th = 18, r = Math.min(4, bw / 2);
      var hl = vis.highlight && row.label === vis.highlight;
      // Rounded at the data end only; square at the baseline.
      var path = row.value < 0
        ? "M" + (bx + bw) + "," + by + " H" + (bx + r) + " Q" + bx + "," + by + " " + bx + "," + (by + r) + " V" + (by + th - r) + " Q" + bx + "," + (by + th) + " " + (bx + r) + "," + (by + th) + " H" + (bx + bw) + " Z"
        : "M" + bx + "," + by + " H" + (bx + bw - r) + " Q" + (bx + bw) + "," + by + " " + (bx + bw) + "," + (by + r) + " V" + (by + th - r) + " Q" + (bx + bw) + "," + (by + th) + " " + (bx + bw - r) + "," + (by + th) + " H" + bx + " Z";
      var tx = row.value < 0 ? bx - 6 : bx + bw + 6, anchor = row.value < 0 ? "end" : "start";
      out += '<g class="row"><title>' + esc(row.label + ": " + fmtNum(row.value, vis)) + "</title>";
      out += '<text class="lbl" x="' + (minV < 0 ? 0 : 0) + '" y="' + (y + 14) + '" font-size="14">' + esc(row.label) + "</text>";
      out += '<path class="bar' + (hl ? " hl" : "") + '" d="' + path + '"/>';
      out += '<text class="val" x="' + tx + '" y="' + (by + 14) + '" font-size="14" text-anchor="' + anchor + '">' + esc(fmtNum(row.value, vis)) + "</text></g>";
    });
    return out + "</svg>";
  }
  function lineSvg(vis) {
    var W = figW(), H = 250, L = 52, R = 70, T = 14, B = 30, d = vis.data, n = d.length;
    var vals = d.map(function (x) { return x.value; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (vis.zero !== false && lo > 0) lo = 0;
    var ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = ticks[ticks.length - 1];
    var X = function (i) { return L + (n === 1 ? 0 : i * (W - L - R) / (n - 1)); };
    var Y = function (v) { return T + (hi - v) * (H - T - B) / ((hi - lo) || 1); };
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(vis.title) + '">';
    ticks.forEach(function (t) { out += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/><text class="tick" x="' + (L - 8) + '" y="' + (Y(t) + 4) + '" font-size="12" text-anchor="end">' + esc(fmtNum(t, { prefix: vis.prefix, unit: vis.unit, decimals: vis.decimals })) + "</text>"; });
    var pts = d.map(function (x, i) { return X(i) + "," + Y(x.value); });
    out += '<path class="area" d="M' + X(0) + "," + Y(Math.max(lo, 0)) + " L" + pts.join(" L") + " L" + X(n - 1) + "," + Y(Math.max(lo, 0)) + ' Z"/>';
    out += '<path class="line" d="M' + pts.join(" L") + '"/>';
    var showX = n <= 6 ? d.map(function (_, i) { return i; }) : [0, Math.floor((n - 1) / 2), n - 1];
    showX.forEach(function (i) { out += '<text class="tick" x="' + X(i) + '" y="' + (H - 8) + '" font-size="12" text-anchor="' + (i === 0 ? "start" : i === n - 1 ? "end" : "middle") + '">' + esc(d[i].label) + "</text>"; });
    d.forEach(function (x, i) {
      var last = i === n - 1;
      out += '<g class="pt"><title>' + esc(x.label + ": " + fmtNum(x.value, vis)) + '</title><circle class="hit" cx="' + X(i) + '" cy="' + Y(x.value) + '" r="14"/>' +
        (last || (vis.highlight && x.label === vis.highlight) ? '<circle class="dot" cx="' + X(i) + '" cy="' + Y(x.value) + '" r="4.5"/>' : "") + "</g>";
    });
    out += '<text class="val" x="' + (X(n - 1) + 10) + '" y="' + (Y(vals[n - 1]) + 5) + '" font-size="14">' + esc(fmtNum(vals[n - 1], vis)) + "</text>";
    return out + "</svg>";
  }
  function figureHtml(vis) {
    var body;
    if (vis.type === "stats") {
      body = '<div class="stats">' + vis.data.map(function (x) {
        return '<div class="stat"><span class="v">' + esc(typeof x.value === "number" ? fmtNum(x.value, vis) : x.value) + '</span><span class="l">' + esc(x.label) + "</span></div>";
      }).join("") + "</div>";
    } else {
      body = vis.type === "line" ? lineSvg(vis) : barSvg(vis);
      body += '<details><summary>Show the numbers</summary><div class="tbl-wrap"><table><tbody>' + vis.data.map(function (x) {
        return "<tr><td>" + esc(x.label) + '</td><td class="num">' + esc(fmtNum(x.value, vis)) + "</td></tr>";
      }).join("") + "</tbody></table></div></details>";
    }
    return '<figure class="fig"><figcaption><span class="fig-title">' + esc(vis.title) + "</span>" +
      (vis.note ? '<span class="fig-note">' + esc(vis.note) + "</span>" : "") + "</figcaption>" + body +
      '<span class="fig-src">Source: ' + esc(vis.source) + "</span></figure>";
  }

  function starRow(name, value, k) {
    var out = '<div class="stars" role="radiogroup" aria-label="' + name + '">';
    for (var i = 1; i <= 5; i++) {
      out += '<button type="button" class="star' + (i <= value ? " on" : "") + '" role="radio" aria-checked="' + (i === value) + '" aria-label="' + i + ' of 5" data-k="' + k + '" data-scale="' + name.toLowerCase() + '" data-v="' + i + '">' + STAR + "</button>";
    }
    return out + "</div>";
  }

  function cardHtml(date, a) {
    var k = key(date, a.id);
    var r = state.ratings[k];
    var open = !!state.open[k] || OFFLINE;
    var rated = r && (r.relevance || r.quality);
    var vote = voteOf(r);
    var h = '<article class="card" id="card-' + k + '" style="--tc: var(--t-' + esc(a.topic) + ')">';
    h += '<div class="card-head" data-toggle="' + k + '">';
    h += '<div class="meta"><span class="topic">' + esc(TOPICS[a.topic] || a.topic) + "</span>";
    if (a.kind && a.kind !== "news") h += '<span class="kind ' + esc(a.kind) + '">' + (a.kind === "opinion" ? "Opinion" : "Analysis") + "</span>";
    h += '<span class="mins">' + (a.read_minutes || 2) + " min</span>";
    if (rated) h += '<span class="rated">Rated R' + (r.relevance || "–") + " · Q" + (r.quality || "–") + "</span>";
    else if (vote) h += '<span class="rated">' + VOTE_LABEL[vote] + "</span>";
    h += "</div>";
    h += "<h3>" + esc(a.title) + "</h3>";
    if (a.update_of) h += '<div class="update-of">Update to: ' + esc(a.update_of) + "</div>";
    if (a.from_brief) {
      var fq = state.requests[a.from_brief], ff = (fq && fq.focus) || a.request_focus;
      h += '<div class="update-of asked">You asked for this one from More stories' + (ff ? ': \u201c' + esc(ff) + '\u201d' : ".") + "</div>";
    }
    h += '<ul class="tldr">' + (a.tldr || []).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>";
    h += '<div class="head-actions">';
    if (!OFFLINE) h += '<button type="button" class="toggle" aria-expanded="' + open + '">' + (open ? "Close" : "Read the full article") + "</button>";
    h += '<span class="thumbs" role="group" aria-label="Quick rating from the summary">' +
      ["up", "mid", "down"].map(function (v) {
        return '<button type="button" class="thumb ' + v + '" data-vote="' + v + '" data-k="' + k + '" aria-pressed="' + (vote === v) + '" aria-label="' + VOTE_LABEL[v] + '" title="' + VOTE_LABEL[v] + '">' + THUMB + "</button>";
      }).join("") + "</span>";
    h += "</div>";
    h += "</div>";
    if (open) {
      var paras = a.body.map(function (p) { return "<p>" + esc(p) + "</p>"; });
      if (a.visual) {
        // Put the figure after the second paragraph, once the story has been set up.
        var at = Math.min(2, paras.length);
        h += '<div class="card-body"><div class="prose">' + paras.slice(0, at).join("") + "</div>" + figureHtml(a.visual) +
          (paras.length > at ? '<div class="prose">' + paras.slice(at).join("") + "</div>" : "");
      } else {
        h += '<div class="card-body"><div class="prose">' + paras.join("") + "</div>";
      }
      if (a.why_it_matters) h += '<div class="why"><strong>' + (a.topic === "industry" ? "Why it matters for KHD" : "Why it matters") + "</strong>" + esc(a.why_it_matters) + "</div>";
      h += '<div class="sources"><h4>Sources</h4><ul>' + (a.sources || []).map(function (s) {
        return '<li><span class="outlet">' + esc(s.outlet) + '</span><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title || s.url) + "</a></li>";
      }).join("") + "</ul></div>";
      if (a.tags && a.tags.length) h += '<div class="tags">' + a.tags.map(function (t) { return "<span>#" + esc(t) + "</span>"; }).join("") + "</div>";
      h += '<div class="share"><h4 style="margin:0;font-family:var(--f-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)">Share</h4><div class="share-row">' +
        (OFFLINE ? "" : '<button type="button" class="share-btn" data-pdf="' + k + '">Save as PDF</button>') +
        '<button type="button" class="share-btn" data-share="summary" data-k="' + k + '">Copy summary</button>' +
        '<button type="button" class="share-btn" data-share="full" data-k="' + k + '">Copy full article</button>' +
        '<a class="share-btn" target="_blank" rel="noopener" href="mailto:?subject=' + encodeURIComponent(a.title) + '&body=' + encodeURIComponent(shareText(a, "summary")) + '">Email</a>' +
        (navigator.share ? '<button type="button" class="share-btn" data-share="native" data-k="' + k + '">More…</button>' : "") +
        '<span class="share-msg" data-share-msg="' + k + '" role="status"></span></div></div>';
      h += "</div>";
      h += slipHtml(date, a);
    }
    return h + "</article>";
  }

  function slipHtml(date, a) {
    var k = key(date, a.id);
    var r = state.ratings[k] || { relevance: 0, quality: 0, quick_tags: [], feedback: "" };
    var h = '<div class="slip"><h4>Rate this article</h4><div class="scales">';
    h += '<div class="scale"><label>Relevance</label><span class="hint">Do you want stories like this?</span>' + starRow("Relevance", r.relevance, k) + "</div>";
    h += '<div class="scale"><label>Quality</label><span class="hint">Was it well written and well sourced?</span>' + starRow("Quality", r.quality, k) + "</div>";
    h += '</div><div class="qtags">' + QUICK.map(function (q) {
      var on = (r.quick_tags || []).indexOf(q[0]) >= 0;
      return '<button type="button" class="qtag" data-k="' + k + '" data-q="' + q[0] + '" aria-pressed="' + on + '">' + q[1] + "</button>";
    }).join("") + "</div>";
    h += '<div class="note"><label for="fb-' + k + '">Notes for tomorrow\'s agent</label><textarea id="fb-' + k + '" data-k="' + k + '" placeholder="e.g. More on this. Explain the background next time. Less from this outlet.">' + esc(r.feedback) + "</textarea></div>";
    h += '<div class="saved" data-saved="' + k + '"></div></div>';
    return h;
  }

  function renderToday() {
    var ed = byDate[state.date];
    var list = ed.articles.filter(function (a) {
      if (state.filter === "all") return true;
      if (state.filter === "unrated") return !isRated(ed.date, a);
      return a.topic === state.filter;
    });
    var h = '<div class="banner" id="db-banner" hidden></div>';
    if (state.date !== DATA.edition.date) h += '<div class="banner">You are reading the edition for ' + fmtDate(state.date) + '. <button type="button" class="toggle" data-go-today="1">Back to today</button></div>';
    var round = 0;
    var multiRound = (ed.rounds || []).length > 1;
    list.forEach(function (a) {
      if (multiRound && (a.round || 1) !== round) {
        round = a.round || 1;
        var meta = (ed.rounds || []).filter(function (x) { return x.round === round; })[0];
        h += '<div class="round-head">' + (round === 1 ? "Morning edition" : "Refresh " + (round - 1)) + (meta && meta.generated_at ? " · " + new Date(meta.generated_at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "") + "</div>";
      }
      h += cardHtml(ed.date, a);
    });
    if (!list.length) h += '<p class="empty">' + (state.filter === "unrated" ? "Everything here is rated. Thank you." : "Nothing in this section today.") + "</p>";
    $("view").innerHTML = h;
  }

  function renderArchive() {
    var h = '<section class="panel"><h2>Recent editions</h2><ul class="arch-list">';
    editions.forEach(function (e) {
      var rated = e.articles.filter(function (a) { return isRated(e.date, a); }).length;
      h += '<li><button type="button" data-date="' + e.date + '"><span>' + fmtDate(e.date) + '</span><span class="m">' + e.articles.length + " articles · " + rated + " rated</span></button></li>";
    });
    h += "</ul><p class=\"empty\">Older editions are kept in the GitHub repo.</p></section>";
    $("view").innerHTML = h;
  }

  function mdToHtml(md) {
    var out = [], inList = false;
    md.split("\n").forEach(function (line) {
      var t = line.trim();
      if (/^- /.test(t)) {
        if (!inList) { out.push("<ul>"); inList = true; }
        out.push("<li>" + esc(t.slice(2)) + "</li>");
        return;
      }
      if (inList) { out.push("</ul>"); inList = false; }
      if (/^#{1,6} /.test(t)) {
        var level = t.match(/^#+/)[0].length;
        if (level > 1) out.push("<h3>" + esc(t.replace(/^#+ /, "")) + "</h3>");
      } else if (t) out.push("<p>" + esc(t) + "</p>");
    });
    if (inList) out.push("</ul>");
    return out.join("");
  }

  function renderAbout() {
    var s = DATA.stats || {};
    var h = '<section class="panel"><h2>What I\'ve learned about you</h2>';
    var rows = TOPIC_ORDER.map(function (t) { return [t, (s.topics || {})[t]]; }).filter(function (x) { return x[1]; });
    if (rows.length) {
      h += '<div class="tbl-wrap"><table><thead><tr><th>Topic</th><th>Ratings</th><th>Relevance</th><th>Quality</th></tr></thead><tbody>';
      rows.forEach(function (x) {
        var v = x[1];
        h += "<tr><td>" + TOPICS[x[0]] + '</td><td class="num">' + v.n + '</td><td class="num">' + (v.avg_relevance != null ? v.avg_relevance.toFixed(1) : "–") + '</td><td class="num">' + (v.avg_quality != null ? v.avg_quality.toFixed(1) : "–") + "</td></tr>";
      });
      h += "</tbody></table></div>";
    } else {
      h += '<p class="empty">No ratings processed yet. Scores appear here after the agent reads your first ratings.</p>';
    }
    h += '<div class="md">' + mdToHtml(DATA.learned || "") + "</div>";
    if (DATA.standing) h += '<div class="md">' + mdToHtml(DATA.standing) + "</div>";
    h += '<p class="empty">To correct anything here, leave a note on any article, or ask Claude to edit profile/learned.md.</p></section>';
    $("view").innerHTML = h;
  }

  function renderAll(keepScroll) {
    renderMast();
    renderRail();
    var y = window.scrollY;
    var active = document.activeElement && document.activeElement.id;
    if (state.view === "today") renderToday();
    else if (state.view === "archive") renderArchive();
    else if (state.view === "more") renderMore();
    else renderAbout();
    if (keepScroll) {
      window.scrollTo(0, y);
      if (active && $(active)) { try { $(active).focus({ preventScroll: true }); } catch (e) {} }
    }
  }

  // ---------- events ----------
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("button, .card-head");
    if (!t) return;
    if (t.classList.contains("tab")) { state.view = t.dataset.view; state.filter = "all"; renderAll(); window.scrollTo(0, 0); return; }
    if (t.dataset.req) { toggleRequest(t.dataset.req); return; }
    if (t.id === "req-refresh") { if (window.__startRefresh) { window.__startRefresh($("refresh-status")); window.scrollTo(0, 0); } return; }
    if (t.dataset.goto) {
      var g = splitKey(t.dataset.goto);
      state.view = "today"; state.date = g.date; state.filter = "all"; state.open[t.dataset.goto] = true; renderAll();
      var el = $("card-" + t.dataset.goto); if (el) el.scrollIntoView({ block: "start" });
      return;
    }
    if (t.dataset.filter) { state.filter = t.dataset.filter; renderAll(); return; }
    if (t.dataset.date) { state.date = t.dataset.date; state.view = "today"; state.filter = "all"; renderAll(); window.scrollTo(0, 0); return; }
    if (t.dataset.goToday) { state.date = DATA.edition.date; renderAll(); return; }
    if (t.dataset.vote) {
      var pv = splitKey(t.dataset.k), av = findArt(pv);
      if (!av) return;
      var rv = ratingFor(pv.date, av), v = t.dataset.vote;
      rv.summary_vote = voteOf(rv) === v ? "" : v;
      rerenderCard(pv.date, av);
      queueSave(pv.date, av);
      renderRail();
      return;
    }
    if (t.dataset.share) { doShare(t); return; }
    if (t.dataset.pdf) {
      var pp = splitKey(t.dataset.pdf), pa = findArt(pp);
      if (pa) savePdf("pdf/" + pp.date + "/" + pa.id + ".pdf", pa.title.replace(/[^\w\s-]/g, "").trim().slice(0, 80) + ".pdf", document.querySelector('[data-share-msg="' + t.dataset.pdf + '"]'));
      return;
    }
    if (t.id === "edition-pdf") { savePdf("pdf/" + state.date + "/daily-brief-" + state.date + ".pdf", "daily-brief-" + state.date + ".pdf", $("refresh-status")); return; }
    if (t.classList.contains("star")) {
      var parts = splitKey(t.dataset.k), a = findArt(parts);
      if (!a) return;
      var r = ratingFor(parts.date, a), v = +t.dataset.v;
      r[t.dataset.scale] = r[t.dataset.scale] === v ? 0 : v;
      rerenderCard(parts.date, a);
      queueSave(parts.date, a);
      renderRail();
      return;
    }
    if (t.classList.contains("qtag")) {
      var p2 = splitKey(t.dataset.k), a2 = findArt(p2);
      if (!a2) return;
      var r2 = ratingFor(p2.date, a2), q = t.dataset.q, cur = (r2.quick_tags || []).slice(), i = cur.indexOf(q);
      if (i >= 0) cur.splice(i, 1); else cur.push(q);
      r2.quick_tags = cur;
      queueSave(p2.date, a2);
      t.setAttribute("aria-pressed", String(i < 0));
      return;
    }
    var head = ev.target.closest(".card-head");
    if (head && !OFFLINE && !ev.target.closest("a")) {
      var k = head.dataset.toggle;
      state.open[k] = !state.open[k];
      var p3 = splitKey(k), a3 = findArt(p3);
      if (a3) rerenderCard(p3.date, a3);
      if (!state.open[k]) { var c = $("card-" + k); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView({ block: "start" }); }
    }
  });
  document.addEventListener("input", function (ev) {
    var ta = ev.target;
    if (ta.tagName !== "TEXTAREA" || !ta.dataset.k) return;
    var p = splitKey(ta.dataset.k), a = findArt(p);
    if (!a) return;
    ratingFor(p.date, a).feedback = ta.value;
    queueSave(p.date, a, 1500);
  });
  var focusTimers = {};
  function saveFocus(k) {
    clearTimeout(focusTimers[k]);
    var rq = state.requests[k];
    if (!rq || !state.db) return;
    var el = document.querySelector('[data-saved="req-' + k + '"]');
    reqPending[k] = "add";
    state.db.doc("requests/" + k).set(JSON.parse(JSON.stringify(rq))).then(function () {
      delete reqPending[k];
      if (el) { el.textContent = "Saved ✓"; el.className = "saved ok"; }
    }, function () {
      delete reqPending[k];
      if (el) { el.textContent = "Not saved. Check your connection and type again to retry."; el.className = "saved err"; }
    });
  }
  document.addEventListener("input", function (ev) {
    var k = ev.target.dataset && ev.target.dataset.focus;
    if (!k || !state.requests[k]) return;
    state.requests[k].focus = ev.target.value;
    reqPending[k] = "add";
    var el = document.querySelector('[data-saved="req-' + k + '"]');
    if (el) { el.textContent = "Saving…"; el.className = "saved"; }
    clearTimeout(focusTimers[k]);
    focusTimers[k] = setTimeout(function () { saveFocus(k); }, 1200);
  });
  document.addEventListener("focusout", function (ev) {
    var fk = ev.target.dataset && ev.target.dataset.focus;
    if (fk && focusTimers[fk]) saveFocus(fk);
    var ta = ev.target;
    if (ta.tagName !== "TEXTAREA" || !ta.dataset.k || !pending[ta.dataset.k]) return;
    clearTimeout(timers[ta.dataset.k]);
    flush(ta.dataset.k);
  });

  function splitKey(k) { var i = k.indexOf("_"); return { date: k.slice(0, i), id: k.slice(i + 1) }; }
  function findArt(p) {
    var e = byDate[p.date];
    if (!e) return null;
    var list = p.id.charAt(0) === "b" ? (e.briefs || []) : e.articles;
    return list.filter(function (a) { return a.id === p.id; })[0];
  }
  function rerenderCard(date, a) {
    var el = $("card-" + key(date, a.id));
    if (!el) return;
    var focusId = document.activeElement && document.activeElement.id;
    var tmp = document.createElement("div");
    tmp.innerHTML = a.id.charAt(0) === "b" ? briefHtml(date, a) : cardHtml(date, a);
    el.replaceWith(tmp.firstChild);
    if (focusId && $(focusId)) $(focusId).focus({ preventScroll: true });
  }

  $("foot").textContent = "Daily Brief · generated " + (DATA.edition.generated_at ? new Date(DATA.edition.generated_at).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) : DATA.edition.date) + (OFFLINE ? " · offline copy" : "");
  refreshSetup();
  renderAll();
  connectDb();
})();
</script>
